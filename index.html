<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OVA: Máximos y mínimos</title>
<style>
:root{--ink:#1b1b1b;--muted:#555;--acc:#2e7d32;--ok:#2e7d32;--bad:#616161;--hl:#e8f5e9;--line:#a5d6a7}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;color:var(--ink);font-size:17px;line-height:1.6;background:#fff;padding-bottom:84px}
header{background:#2e7d32;color:#fff;position:sticky;top:0;z-index:5;padding:10px 16px}
.ttl{max-width:720px;margin:0 auto 8px;display:flex;align-items:center;gap:10px}
.ttl img{height:44px;width:auto;background:#fff;border-radius:4px;padding:2px}
.ttl b{display:block;font-size:18px;line-height:1.2}
.ttl small{display:block;font-size:13px;opacity:.9}
.foot{text-align:center;font-size:13px;color:#555;margin-top:12px}
.cover{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.cover img{height:90px;width:auto}
.cover div{font-size:15px;line-height:1.4}
.cover b{color:#1b5e20;font-size:17px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
.top b{font-size:14px;font-weight:normal}
.top select{font-size:14px;padding:5px 8px;border:1px solid #fff;border-radius:3px;background:#fff;color:#1b1b1b;max-width:62%}
.bar{height:5px;background:#66bb6a;max-width:720px;margin:8px auto 0}
.bar i{display:block;height:100%;background:#fff;width:0}
:focus-visible{outline:3px solid #1b5e20;outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:16px}
.page{background:#fff;border:1px solid var(--line);padding:20px 18px}
h2{font-size:26px;line-height:1.25;margin:0 0 12px;color:var(--acc)}
h3{font-size:19px;margin:20px 0 6px;color:#1b5e20}
p{margin:0 0 12px}
.box{background:var(--hl);border-left:5px solid var(--acc);padding:10px 14px;margin:12px 0}
.math{font-size:18px}
a{color:var(--acc);font-weight:bold}
.btn{display:inline-block;background:var(--acc);color:#fff;border:2px solid var(--acc);border-radius:3px;padding:11px 20px;font-size:16px;font-weight:bold;cursor:pointer;text-decoration:none}
.btn.alt{background:#fff;color:var(--acc)}
.btn:disabled{opacity:.35;cursor:default}
.pager{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--acc);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.pager div{display:flex;gap:10px;max-width:720px;margin:0 auto}
.pager .btn{flex:1}
svg{width:100%;height:auto;max-width:420px;display:block;margin:8px 0;background:#fff;border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 12px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:3px;font-size:16px;cursor:pointer}
.opt.ok{border-color:#2e7d32;background:#c8e6c9}
.opt.bad{border-color:#9e9e9e;background:#eeeeee}
.fb{font-size:15px;color:var(--muted);margin:2px 0 14px}
details{border:1px solid var(--line);padding:8px 12px;margin:8px 0}
summary{cursor:pointer;font-weight:bold;padding:4px 0}
ul,ol{padding-left:22px}li{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:16px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:var(--hl)}
input[type=range]{width:100%;margin:8px 0;accent-color:#2e7d32}
</style>
</head>

var GAME_URL=''; // Pega aquí el enlace del juego, por ejemplo https://TU-USUARIO.github.io/juego-maximos/juego_arepas.html
var yt=function(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q)};
var S=[
{t:'Bienvenida',h:function(){return '<div class="cover"><img alt="Escudo" src="'+document.getElementById('crest').src+'"><div><b>Universidad de Cundinamarca</b><br>Sede Facatativá</div></div><h2>¡Bienvenido!</h2><p>Esta OVA te enseña <b>máximos y mínimos</b> de una función paso a paso. Solo necesitas lo básico de derivadas.</p><h3>Al terminar, podrás</h3><ul><li>Explicar qué es un máximo y un mínimo.</li><li>Diferenciar absolutos y relativos.</li><li>Calcular puntos críticos con la derivada.</li><li>Clasificarlos con la primera y la segunda derivada.</li><li>Resolver problemas de optimización sencillos.</li></ul><h3>Cómo usarla</h3><p>Usa los botones <b>Anterior</b> y <b>Siguiente</b> de abajo. También puedes saltar a cualquier tema con el menú de arriba.</p><div class="box">Recuerda: la derivada <span class="math">f′(x)</span> te dice la <b>pendiente</b> de la curva en cada punto. Si es positiva la función sube; si es negativa, baja.</div>'}},
{t:'¿Qué es un máximo y un mínimo?',h:function(){return '<h2>¿Qué es un máximo y un mínimo?</h2><p>Imagina una montaña rusa. La <b>cima</b> de una subida es un <b>máximo</b>. El <b>fondo</b> de un valle es un <b>mínimo</b>.</p><svg viewBox="0 0 320 160" role="img" aria-label="Curva con un máximo y un mínimo"><path d="M10 110 C70 -10 110 -10 160 80 S250 190 310 50" fill="none" stroke="var(--acc)" stroke-width="3"/><circle cx="88" cy="33" r="6" fill="var(--bad)"/><text x="98" y="30" fill="var(--ink)" font-size="13">máximo</text><circle cx="225" cy="122" r="6" fill="var(--ok)"/><text x="170" y="150" fill="var(--ink)" font-size="13">mínimo</text></svg><div class="box"><b>Definición.</b> f(c) es un <b>máximo</b> si f(c) ≥ f(x) para los x cercanos a c. Es un <b>mínimo</b> si f(c) ≤ f(x) para los x cercanos a c.</div><p><a href="'+yt('máximos y mínimos de una función explicación fácil')+'" target="_blank" rel="noopener">Ver video de apoyo</a></p>'}},
{t:'Absolutos y relativos',h:function(){return '<h2>Absolutos y relativos</h2><table><tr><th>Tipo</th><th>Significa</th></tr><tr><td><b>Relativo (local)</b></td><td>El más alto o más bajo solo en los alrededores del punto.</td></tr><tr><td><b>Absoluto (global)</b></td><td>El más alto o más bajo en todo el dominio analizado.</td></tr></table><svg viewBox="0 0 320 160" role="img" aria-label="Curva con máximo relativo y absoluto"><path d="M10 120 C50 20 90 20 120 90 S170 140 200 90 S260 -20 310 30" fill="none" stroke="var(--acc)" stroke-width="3"/><circle cx="62" cy="36" r="6" fill="var(--bad)"/><text x="30" y="20" fill="var(--ink)" font-size="12">máx. relativo</text><circle cx="160" cy="122" r="6" fill="var(--ok)"/><text x="120" y="150" fill="var(--ink)" font-size="12">mín. absoluto</text><circle cx="262" cy="10" r="6" fill="var(--bad)"/><text x="200" y="28" fill="var(--ink)" font-size="12">máx. absoluto</text></svg><div class="box">Todo máximo absoluto también es relativo, pero no al revés.</div><h3>¿Cómo hallo los absolutos en [a, b]?</h3><ol><li>Halla los puntos críticos dentro del intervalo.</li><li>Evalúa f en ellos <b>y también en a y en b</b>.</li><li>El valor mayor es el máximo absoluto; el menor, el mínimo absoluto.</li></ol><p><b>Ejemplo:</b> f(x) = x² − 4x en [0, 5]. f′ = 2x − 4 = 0 → x = 2.<br>f(0) = 0 · f(2) = −4 · f(5) = 5.<br>Mínimo absoluto: −4 (en x = 2). Máximo absoluto: 5 (en x = 5).</p>'}},
{t:'Derivada y puntos críticos',h:function(){return '<h2>Derivada y puntos críticos</h2><p>En una cima o en un valle la tangente es horizontal: la pendiente es 0.</p><div class="box"><b>Punto crítico:</b> un valor x = c donde <span class="math">f′(c) = 0</span> o donde f′(c) no existe.</div><h3>Pasos</h3><ol><li>Deriva la función.</li><li>Iguala f′(x) = 0 y resuelve.</li><li>Los x que salgan son los puntos críticos.</li></ol><h3>Ejemplo: f(x) = x³ − 3x</h3><p class="math">f′(x) = 3x² − 3 = 0 → x² = 1 → x = −1 y x = 1</p><div class="box"><b>Ojo:</b> f′ = 0 no garantiza que haya máximo o mínimo. En f(x) = x³, f′(0) = 0 pero la curva sigue subiendo. Por eso hay que <b>clasificar</b> cada punto (siguientes temas).</div><h3>Pruébalo</h3><p>Mueve el deslizador. En x = −1 y x = 1 la tangente queda horizontal.</p><svg id="g" viewBox="0 0 320 220" role="img" aria-label="Gráfica de x al cubo menos 3x con tangente"></svg><label>x = <b id="xv">0.0</b><input id="sl" type="range" min="-2.1" max="2.1" step="0.1" value="0"></label><p id="sv" class="fb"></p>'},i:function(){
var s=document.getElementById('sl');if(!s)return;
function X(x){return 160+x*65}function Y(y){return 110-y*22}
function d(){var x=+s.value,m=3*x*x-3,y=x*x*x-3*x,p='';
for(var k=-2.2;k<=2.2;k+=.05)p+=(p?'L':'M')+X(k).toFixed(1)+' '+Y(k*k*k-3*k).toFixed(1);
var a=x-.8,b=x+.8;
document.getElementById('g').innerHTML='<line x1="0" y1="110" x2="320" y2="110" stroke="var(--line)"/><line x1="160" y1="0" x2="160" y2="220" stroke="var(--line)"/><path d="'+p+'" fill="none" stroke="var(--acc)" stroke-width="3"/><line x1="'+X(a)+'" y1="'+Y(y+m*(a-x))+'" x2="'+X(b)+'" y2="'+Y(y+m*(b-x))+'" stroke="var(--bad)" stroke-width="2.5"/><circle cx="'+X(x)+'" cy="'+Y(y)+'" r="6" fill="var(--bad)"/>';
document.getElementById('xv').textContent=x.toFixed(1);
var c=Math.abs(m)<0.05;
document.getElementById('sv').textContent='Pendiente f′(x) = '+m.toFixed(2)+(c?' → ¡punto crítico! La tangente es horizontal.':(m>0?' → la función va subiendo.':' → la función va bajando.'))}
s.oninput=d;d()}},
{t:'Criterio de la 1.ª derivada',h:function(){return '<h2>Criterio de la primera derivada</h2><p>Mira el <b>signo de f′</b> antes y después de cada punto crítico c:</p><table><tr><th>Antes de c</th><th>Después de c</th><th>Resultado</th></tr><tr><td>f′ &gt; 0 (sube)</td><td>f′ &lt; 0 (baja)</td><td><b>Máximo</b></td></tr><tr><td>f′ &lt; 0 (baja)</td><td>f′ &gt; 0 (sube)</td><td><b>Mínimo</b></td></tr><tr><td colspan="2">No cambia de signo</td><td>Ninguno</td></tr></table><h3>Ejemplo: f(x) = x³ − 3x</h3><p>Puntos críticos: x = −1 y x = 1. Prueba un valor en cada zona de f′(x) = 3x² − 3:</p><ul><li>x = −2: f′ = 9 &gt; 0 (sube)</li><li>x = 0: f′ = −3 &lt; 0 (baja)</li><li>x = 2: f′ = 9 &gt; 0 (sube)</li></ul><p>En x = −1 pasa de subir a bajar → <b>máximo</b>: f(−1) = 2.<br>En x = 1 pasa de bajar a subir → <b>mínimo</b>: f(1) = −2.</p><div class="box"><b>Error común:</b> decir «el máximo es x = −1». La x dice <i>dónde</i> está; el máximo (la altura) es <b>f(−1) = 2</b>. Siempre sustituye en f.</div><p><a href="'+yt('criterio de la primera derivada máximos y mínimos')+'" target="_blank" rel="noopener">Ver video de apoyo</a></p>'}},
{t:'Criterio de la 2.ª derivada',h:function(){return '<h2>Criterio de la segunda derivada</h2><p>Es un atajo: evalúas <b>f″(c)</b> en cada punto crítico.</p><table><tr><th>Si…</th><th>Entonces</th></tr><tr><td>f″(c) &gt; 0 (cóncava hacia arriba)</td><td><b>Mínimo</b></td></tr><tr><td>f″(c) &lt; 0 (cóncava hacia abajo)</td><td><b>Máximo</b></td></tr><tr><td>f″(c) = 0</td><td>No decide: usa la primera derivada</td></tr></table><h3>Ejemplo: f(x) = x³ − 3x</h3><p class="math">f′(x) = 3x² − 3 → f″(x) = 6x<br>f″(−1) = −6 &lt; 0 → máximo<br>f″(1) = 6 &gt; 0 → mínimo</p><div class="box"><b>¿Cuál criterio uso?</b> Si f″ es fácil de calcular, usa la segunda derivada. Si f″(c) = 0, usa la primera. Ejemplo: f(x) = x³ tiene f″(0) = 0, y con la primera derivada se ve que no hay máximo ni mínimo.</div><p><a href="'+yt('criterio de la segunda derivada máximos y mínimos')+'" target="_blank" rel="noopener">Ver video de apoyo</a></p>'}},
{t:'Problemas de optimización',h:function(){return '<h2>Problemas de optimización</h2><p>Optimizar es buscar lo <b>mejor posible</b>: mayor área, menor costo, mayor ganancia.</p><ol><li>Lee y dibuja el problema.</li><li>Escribe la función que quieres maximizar o minimizar.</li><li>Usa los datos para dejarla con una sola variable.</li><li>Deriva e iguala a cero.</li><li>Comprueba si es máximo o mínimo y responde con unidades.</li></ol><h3>Ejemplo</h3><div class="box">Tienes 100 m de malla para cercar un terreno rectangular. ¿Qué medidas dan el área máxima?</div><p class="math">2x + 2y = 100 → y = 50 − x<br>A(x) = x(50 − x) = 50x − x²<br>A′(x) = 50 − 2x = 0 → x = 25<br>y = 25 → A = 625 m²</p><p>Como A″ = −2 &lt; 0, es un máximo. <b>Respuesta:</b> un cuadrado de 25 m × 25 m, con área de 625 m².</p><h3>Errores comunes</h3><ul><li>Dejar la función con dos variables.</li><li>Dar solo x cuando piden el área, el costo u otro valor.</li><li>Olvidar las unidades.</li></ul><p><a href="'+yt('problemas de optimización máximos y mínimos cálculo ejemplos')+'" target="_blank" rel="noopener">Ver video de apoyo</a></p>'}},
{t:'Trucos y consejos',h:function(){return '<h2>Trucos y consejos</h2><p>Atajos y hábitos que ahorran tiempo y evitan errores.</p>'
+'<h3>1. El vértice de una parábola, sin derivar</h3><p>Si f(x) = ax² + bx + c, el punto crítico está en <span class="math">x = −b / (2a)</span>. Si a &gt; 0 es un mínimo; si a &lt; 0, un máximo.<br>Ejemplo: f(x) = x² − 4x + 3 → x = 4/2 = 2.</p>'
+'<h3>2. Las raíces dobles no cambian el signo</h3><p>Cuando f′ está factorizada, el signo solo cambia en las raíces que aparecen <b>una vez</b>. Si f′ = (x − 1)²(x + 2): en x = −2 pasa de − a + (mínimo); en x = 1 no cambia de signo, así que no hay máximo ni mínimo.</p>'
+'<h3>3. Antes de derivar, reescribe con potencias</h3><p>Convierte fracciones y raíces en potencias de x: 1/x = x⁻¹ y √x = x^(1/2). Así solo usas la regla xⁿ → n·xⁿ⁻¹.<br>Ejemplo: S = x² + 128/x = x² + 128x⁻¹ → S′ = 2x − 128x⁻².</p>'
+'<h3>4. Si minimizas una distancia, minimiza su cuadrado</h3><p>La distancia d = √(x² + y²) y su cuadrado d² = x² + y² tienen el mínimo en el mismo punto. Derivar d² es mucho más fácil porque no tiene raíz.</p>'
+'<h3>5. Revisa si tu respuesta tiene sentido</h3><p>Con un perímetro fijo, el rectángulo de mayor área es un <b>cuadrado</b>. Si te sale otra cosa, revisa tus cuentas. (Con una pared ya no aplica: por eso el corral dio 20 m × 40 m).</p>'
+'<h3>6. Comprueba con números cercanos</h3><p>Para confirmar un máximo o un mínimo, evalúa f en c − 0,1, en c y en c + 0,1. Si f(c) es mayor que los dos vecinos, es máximo; si es menor, es mínimo.</p>'
+'<h3>7. Revisa el dominio y los bordes</h3><p>En los problemas reales, las medidas deben ser positivas. Descarta los valores de x que no tengan sentido y, si hay un intervalo cerrado, evalúa también los extremos.</p>'
+'<div class="box">Para recordar la segunda derivada: f″ &gt; 0 es una «sonrisa» (valle, mínimo) y f″ &lt; 0 es una «cara triste» (cima, máximo).</div>'}},
{t:'Actividad práctica',h:function(){var E=[['f(x) = x² − 4x + 3','f′ = 2x − 4 = 0 → x = 2. f″ = 2 &gt; 0 → <b>mínimo</b> en x = 2, con f(2) = −1.'],['f(x) = x³ − 12x','f′ = 3x² − 12 = 0 → x = ±2. f″ = 6x. En x = −2: f″ = −12 → <b>máximo</b>, f(−2) = 16. En x = 2: f″ = 12 → <b>mínimo</b>, f(2) = −16.'],['Dos números positivos suman 20. ¿Cuáles dan el producto máximo?','y = 20 − x, P = 20x − x². P′ = 20 − 2x = 0 → x = 10. Los números son 10 y 10, con producto 100 (P″ = −2 &lt; 0, es máximo).'],['f(x) = x³ (pista: ¿f″(0) sirve?)','f′ = 3x² = 0 → x = 0. f″(0) = 0, no decide. Con la primera derivada, f′ es positiva a ambos lados de 0, así que <b>no hay máximo ni mínimo</b>.'],['f(x) = x² − 4x en [0, 5] (extremos absolutos)','Punto crítico x = 2. f(0) = 0, f(2) = −4, f(5) = 5. <b>Mínimo absoluto −4</b> en x = 2; <b>máximo absoluto 5</b> en x = 5.']];
return '<h2>Actividad práctica</h2><p>Resuelve cada ejercicio en tu cuaderno y luego revisa la solución. Halla los puntos críticos y clasifícalos.</p>'+E.map(function(e,i){return '<h3>Ejercicio '+(i+1)+'</h3><p class="math">'+e[0]+'</p><details><summary>Ver solución</summary><p>'+e[1]+'</p></details>'}).join('')+'<p>Para comprobar con una gráfica: <a href="https://www.geogebra.org/graphing" target="_blank" rel="noopener">abrir GeoGebra</a>.</p>'}},
{t:'Reto final',h:function(){var ok=GAME_URL.indexOf('http')==0;return '<h2>Reto final: juego de optimización</h2><p>Pon en práctica lo aprendido con un juego de 3 problemas. En cada uno debes encontrar el máximo o el mínimo usando la derivada:</p><ul><li><b>El precio de las arepas:</b> ¿a qué precio es mayor la ganancia? (máximo)</li><li><b>El corral:</b> ¿qué medidas dan el área mayor? (máximo)</li><li><b>La caja:</b> ¿qué medidas usan menos material? (mínimo)</li></ul><div class="box">Para resolver cada problema hay que modelar, derivar, igualar a 0 y comprobar. Si fallas, el juego te muestra cómo se resuelve.</div>'+(ok?'<a class="btn" style="display:block;text-align:center" href="'+GAME_URL+'" target="_blank" rel="noopener">Ir al juego</a><p class="fb" style="margin-top:10px">Se abre en una pestaña nueva. Cuando termines, vuelve aquí.</p>':'<div class="box"><b>Enlace pendiente.</b> Sube el juego a GitHub Pages y pega su dirección en la variable <b>GAME_URL</b> al inicio del script de este archivo.</div>')}},
{t:'Enlaces y créditos',h:function(){return '<h2>Enlaces y créditos</h2><h3>Para practicar y aprender más</h3><ul><li><a href="https://es.khanacademy.org/math/differential-calculus" target="_blank" rel="noopener">Khan Academy: Cálculo diferencial</a></li><li><a href="https://www.geogebra.org/graphing" target="_blank" rel="noopener">GeoGebra: dibuja funciones y mira sus máximos y mínimos</a></li><li><a href="'+yt('máximos y mínimos cálculo diferencial')+'" target="_blank" rel="noopener">Videos: máximos y mínimos</a></li><li><a href="'+yt('problemas de optimización cálculo ejemplos resueltos')+'" target="_blank" rel="noopener">Videos: problemas de optimización</a></li></ul><h3>Créditos</h3><ul><li><b>Universidad:</b> Universidad de Cundinamarca, sede Facatativá</li><li><b>Asignatura:</b> Cálculo diferencial</li><li><b>Docente:</b> Henry Niño Quintero</li></ul><p><b>Hecho por:</b></p><ul><li>David Ramírez</li><li>Ian Gómez</li><li>Alejandro Sáenz Lozano</li></ul><h3>Bibliografía y webgrafía</h3><ul><li>Stewart, J. <i>Cálculo de una variable: trascendentes tempranas</i>. Cengage Learning.</li><li>Larson, R. y Edwards, B. <i>Cálculo</i>. Cengage Learning.</li><li>Purcell, E., Varberg, D. y Rigdon, S. <i>Cálculo</i>. Pearson.</li><li>Khan Academy en español: <a href="https://es.khanacademy.org/math/differential-calculus" target="_blank" rel="noopener">Cálculo diferencial</a></li><li>GeoGebra: <a href="https://www.geogebra.org/graphing" target="_blank" rel="noopener">Calculadora gráfica</a></li><li>Videos: <a href="'+yt('máximos y mínimos cálculo diferencial')+'" target="_blank" rel="noopener">YouTube</a> (canales como Julioprofe y Matemáticas con Juan).</li></ul><p class="fb">Agrega la fecha de consulta de cada fuente web según la norma que pida tu profesor (APA, por ejemplo).</p>'}}];
